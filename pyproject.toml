[project]
name = "vsf-data"
version = "0.1.0"
description = "Tool gán nhãn & tăng cường dữ liệu POI qua Gemini + Google Maps + TikTok"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "typer>=0.15",
    "rich>=13.9",
]

# Giao diện quản lý là phần TUỲ CHỌN: `vsf run`/`vsf batch` chạy được với đúng 3
# dependency ở trên. Cài thêm khi cần giao diện: `uv pip install -e ".[ui]"`
[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
vsf = "vsf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsf"]

[dependency-groups]
# httpx2: starlette.testclient cần nó để test tầng API. Thiếu thì tests/test_api.py
# tự bỏ qua chứ không làm đỏ cả bộ test.
dev = ["pytest>=8.3", "httpx2>=2.12"]
