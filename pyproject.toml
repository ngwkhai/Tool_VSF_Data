[project]
name = "vsf-data"
version = "0.1.0"
description = "Tool gán nhãn & tăng cường dữ liệu POI qua Gemini + Google Maps + TikTok"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
vsf = "vsf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsf"]

[dependency-groups]
dev = ["pytest>=8.3"]
