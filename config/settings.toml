# Cấu hình chung của tool. Sửa file này, không sửa code.
#
# ┌─ NGƯỜI MỚI ĐỌC ĐÂY ────────────────────────────────────────────────────────┐
# │ Sau khi clone repo, phải sửa ĐÚNG 3 CHỖ trước khi chạy:                    │
# │                                                                            │
# │   1. [gemini] profile_chat_url  -> thread Gemini #1 CỦA BẠN                │
# │   2. [gemini] menu_chat_url     -> thread Gemini #2 CỦA BẠN                │
# │   3. [dataset] labeled_by       -> tên bạn                                 │
# │                                                                            │
# │ URL thread của người khác KHÔNG dùng được — Gemini chỉ cho chủ tài khoản   │
# │ mở thread của mình. Xem README.md mục "Cài đặt lần đầu".                   │
# │                                                                            │
# │ Mọi thứ còn lại đã tinh chỉnh qua nhiều vòng thử. Comment phía trên mỗi    │
# │ prompt ghi rõ cách viết nào ĐÃ THẤT BẠI và vì sao — đọc trước khi sửa.     │
# └────────────────────────────────────────────────────────────────────────────┘

[browser]
# Profile Chrome riêng cho tool — nằm ngoài repo, không lọt vào git.
user_data_dir = "~/.vsf-chrome-profile"
cdp_port = 9222
locale = "vi-VN"
# Giữ browser sống sau khi chạy xong -> lần chạy sau attach ngay, không phải mở lại.
keep_open = true
# Đóng tab trắng và tab trùng slot còn sót từ lần chạy trước. Tool nhận lại tab cũ
# theo URL, nên tab thừa chỉ tốn RAM chứ không dùng vào việc gì.
close_stray_tabs = true
# Kéo tab lên trước mỗi lần điều hướng. Tiện khi chạy một POI và ngồi xem, nhưng
# chạy lô 30 POI thì cửa sổ giật liên tục hàng giờ — đặt false để chạy nền.
bring_to_front = false

# Chế độ chạy lô (`vsf batch`).
[batch]
# Số lần thử tối đa cho một POI. CHỈ áp dụng cho lỗi tạm thời (timeout, mất mạng);
# "lấy nhầm quán" và "không phải FOOD" đi thẳng vào needs_review vì chạy lại cũng
# ra đúng kết luận cũ, chỉ tốn thêm một vòng Gemini.
max_attempts = 2
# Nghỉ giữa hai POI (giây). Cào liên tục không nghỉ dễ ăn rate-limit của Google.
delay_between = 3.0

[gemini]
# Hai thread chat có sẵn của bạn. Giữ nguyên URL để không mất ngữ cảnh hội thoại.
# 2026-08-14: đã thử mở 2 thread MỚI (rỗng) để tránh "nhiễu", nhưng kiểm chứng
# ngược lại — thread rỗng khiến tính năng grounding/tra địa điểm của Gemini
# LUÔN kích hoạt và trả về một mẫu cố định (name/address/phone/rating/
# opening_hours/...) THAY THẾ HOÀN TOÀN định dạng PROFILE_FIELDS yêu cầu, bất
# kể prompt viết thế nào — đã thử 5 cách diễn đạt khác nhau, kể cả seed bằng
# một ví dụ đầy đủ 26 trường kèm xác nhận "Đã hiểu" ngay trước câu hỏi thật,
# vẫn bị ghi đè. Hai thread CŨ (nhiều lịch sử) không gặp vấn đề này — xem POI
# "Gong Cha" (chạy trên thread cũ) có đủ 26/26 trường, so với các POI chạy
# trên thread mới chỉ được ~8/26 dù đã có FIELD_ALIASES vá thêm. Quay lại
# dùng 2 thread gốc.
profile_chat_url = "https://gemini.google.com/app/bac782da2aaa6656?hl=vi"
menu_chat_url = "https://gemini.google.com/app/d65843a92ddf1d63?hl=vi"

# One-shot: hỏi ĐỦ 26 trường + quy ước trong MỘT lượt, thay vì hỏi 17 trường rồi
# tách 2 lượt riêng để bổ sung phần thiếu (đã gây ra tới 3 lượt/POI trước đây,
# tốn thời gian và dễ khiến Gemini lặp lại/trôi khỏi định dạng giữa chừng).
# {poi} = tên POI; {address_clause} = " (địa chỉ: ...)" nếu có địa chỉ mẫu, rỗng
# nếu không — cùng lý do gmaps.search_query() ghép địa chỉ vào truy vấn Maps:
# giúp Gemini không lấy nhầm quán trùng tên ở tỉnh/phố khác.
profile_prompt = """Địa điểm cần tra: "{poi}"{address_clause} tại Nha Trang, Khánh Hòa (có thể có địa điểm trùng tên ở tỉnh/thành khác — chỉ lấy đúng địa điểm này).

Đây là một BIỂU MẪU (template) {n_fields} dòng. Nhiệm vụ của bạn CHỈ là chép lại NGUYÊN VĂN {n_fields} dòng dưới đây rồi điền giá trị vào ngay sau dấu hai chấm của MỖI dòng. TUYỆT ĐỐI KHÔNG được đổi, dịch, viết lại, thêm hay bớt bất kỳ tên trường nào (phần TRƯỚC dấu hai chấm) — giữ nguyên y hệt ký tự cho ký tự, kể cả khi có vẻ nó "nên" được dịch sang tiếng Việt. Không viết thêm dòng nào khác ngoài {n_fields} dòng này (không mở đầu, không dẫn nhập, không trích dẫn nguồn, không markdown, không đánh số). Nếu không tra được thì suy luận hợp lý từ thông tin đã biết, đừng bỏ trống — CHỈ được để trống nếu quy ước bên dưới cho phép:

name_en:
category_l2:
tags:
cuisine_type:
must_try_dishes:
price_per_person_avg:
seating_capacity:
dietary_options:
reservation_required:
dress_code:
alcohol_served:
view_type:
operating_note:
description_short:
description_long:
best_time_to_visit:
estimated_duration:
suitable_for:
not_suitable_for:
insider_tips:
weather_dependency:
crowd_level_note:
matched_intents:
search_keywords:
confidence_level:
info_expiry_note:

Quy ước:
- name_en: CHỈ ghi khi quán thật sự có tên tiếng Anh chính thức. Không có thì ghi "không có" — tuyệt đối đừng bỏ dấu tên tiếng Việt rồi coi đó là tên tiếng Anh
- category_l2: chọn ĐÚNG MỘT trong các nhãn sau, chép NGUYÊN VĂN kể cả dấu và chữ hoa/thường, không dịch, không viết tắt, không tự nghĩ nhãn mới: {l2_values}
- must_try_dishes: 3-5 món đặc trưng, ngăn bởi dấu phẩy
- seating_capacity: chỉ ghi con số chỗ ngồi ước lượng
- reservation_required, alcohol_served: chỉ ghi có hoặc không
- confidence_level: cao, trung bình hoặc thấp
- info_expiry_note: ghi chú thông tin cần kiểm tra lại sau bao lâu"""
# Prompt tự chứa toàn bộ ngữ cảnh — KHÔNG được dựa vào lịch sử chat như câu cũ
# "trích xuất tương tự" (thread mới không có lượt nào trước đó để "tương tự
# theo"). "gia" quy ước theo NGHÌN ĐỒNG để khớp với schema.menu_prices() —
# hàm đó luôn nhân 1000, nên nếu Gemini trả giá đầy đủ VNĐ thì price_min/max sẽ
# sai gấp 1000 lần.
menu_prompt = """Extract every visible restaurant menu item into this exact JSON array format:
[
  {"loai_thuc_pham":"section or category","ten":"item name","gia":"numeric price string"}
]
Rules: use exactly the three keys above; repeat the section for every row; create separate rows for variants such as M and L and append the variant to ten; keep gia as a string, remove currency symbols and a trailing k/K without scaling; use an empty string when a price is unreadable; preserve Vietnamese diacritics; return only the JSON array with no Markdown or explanation.

One more rule specific to this dataset: "gia" must be in units of NGHÌN ĐỒNG (thousands of VND) as a bare integer string — e.g. an item priced "129.000đ" or "129k" must have "gia": "129", not "129000". Do not multiply or add zeros."""

# Gửi khi câu trả lời thực đơn trôi khỏi định dạng JSON (Gemini trả lời văn
# xuôi thay vì mảng JSON). Không nêu lại menu — Gemini vẫn nhìn thấy câu trả lời
# văn xuôi ngay phía trên, chỉ cần ép đúng khuôn.
menu_reformat_prompt = """Hãy trình bày lại thực đơn vừa trích xuất ở trên dưới dạng một mảng JSON, mỗi món là một object với đúng ba khoá "loai_thuc_pham", "ten" và "gia". "gia" chỉ ghi số nguyên theo đơn vị nghìn đồng, KHÔNG dùng dấu phẩy ngăn nghìn (ví dụ 129000 đồng ghi là "129", không ghi "129,000"). Chỉ trả về mảng JSON, không kèm giải thích, không bọc trong khối markdown."""

# Gửi khi câu trả lời đầu chưa đủ trường (thread cũ chỉ trả 18 trường, hoặc
# Gemini trả lời văn xuôi). Phải yêu cầu BỔ SUNG chứ không chỉ "trình bày lại" —
# các trường mới vốn không có trong câu trả lời trước.
# {fields} / {missing} = biểu mẫu (mỗi dòng "ten_truong:") do pipeline.py dựng
# sẵn — xem step_gemini1(). Truyền kèm dấu ":" chứ không chỉ tên trường trần,
# vì "đây là biểu mẫu, chỉ điền vào chỗ trống" neo Gemini theo đúng tên trường
# đáng tin cậy hơn hẳn "tạo dòng theo tên trường sau" (Gemini hay tự dịch tên
# trường sang tiếng Việt nếu chỉ được đưa DANH SÁCH tên, không phải biểu mẫu).
# Hai prompt cho hai tình huống khác nhau — đừng gộp làm một:
#
# 1. reformat_prompt: thread trôi khỏi schema, Gemini trả lời văn xuôi. Phải
#    liệt kê LẠI CẢ BỘ trường để kéo nó về đúng định dạng.
reformat_prompt = """Hãy trình bày lại thông tin trên theo đúng BIỂU MẪU dưới đây: chép lại NGUYÊN VĂN từng dòng rồi điền giá trị sau dấu hai chấm. TUYỆT ĐỐI KHÔNG đổi/dịch tên trường (phần trước dấu hai chấm) sang tiếng Việt (đã từng bị đổi `suitable_for:` thành `doi_tuong_phu_hop:` — không được lặp lại lỗi này). Không thêm tiêu đề, không đánh số, không trích dẫn nguồn:
{fields}"""

# 2. fill_missing_prompt: đã đúng định dạng nhưng thiếu vài trường. CHỈ hỏi
#    những trường thiếu — liệt kê lại cả bộ sẽ khiến Gemini bám theo mẫu 18
#    trường đã lặp nhiều lần trong thread và phớt lờ trường mới.
fill_missing_prompt = """Đây là BIỂU MẪU các trường còn thiếu cho địa điểm vừa rồi. Chép lại NGUYÊN VĂN từng dòng rồi điền giá trị sau dấu hai chấm — TUYỆT ĐỐI KHÔNG đổi/dịch tên trường sang tiếng Việt. Không thêm gì khác, không trích dẫn nguồn. Nếu không tra được thì suy luận hợp lý từ thông tin đã biết, đừng bỏ trống:

{missing}

Quy ước:
- name_en: CHỈ ghi khi quán thật sự có tên tiếng Anh chính thức. Không có thì ghi "không có" — tuyệt đối đừng bỏ dấu tên tiếng Việt rồi coi đó là tên tiếng Anh
- category_l2: chọn ĐÚNG MỘT trong các nhãn sau, chép NGUYÊN VĂN kể cả dấu và chữ hoa/thường, không dịch, không viết tắt, không tự nghĩ nhãn mới: {l2_values}
- must_try_dishes: 3-5 món đặc trưng, ngăn bởi dấu phẩy
- seating_capacity: chỉ ghi con số chỗ ngồi ước lượng
- reservation_required, alcohol_served: chỉ ghi có hoặc không
- confidence_level: cao, trung bình hoặc thấp
- info_expiry_note: ghi chú thông tin cần kiểm tra lại sau bao lâu"""

# Ít hơn ngần này trường thì coi là thread đã trôi -> dùng reformat_prompt trước.
min_fields_before_reformat = 8

# Từ 1/7/2025 Việt Nam sáp nhập đơn vị hành chính cấp xã/phường. Google Maps trả
# về địa chỉ theo tên MỚI; dataset cần cả tên CŨ ở cột old_address. Không suy ra
# được từ dữ liệu Google -> hỏi Gemini.
# Chỉ hỏi TÊN PHƯỜNG CŨ, không đưa kèm địa chỉ hiện tại. Nếu đưa cả địa chỉ vào,
# Gemini chỉ việc chép lại nguyên văn thay vì trả lời (đã kiểm chứng).
# Tool tự ghép lại địa chỉ đầy đủ từ tên phường nhận được.
# [2026-08-17] Ba lần sửa trước đều thất bại:
#  1. Chỉ đưa "số nhà + tên đường" (cắt cụt, bỏ mất phường mới) -> thiếu ngữ
#     cảnh, Gemini liệt kê NGUYÊN 22 phường/xã cũ (2 địa chỉ cách xa nhau ra
#     y hệt cùng một danh sách, luôn nhặt nhầm "Lộc Thọ" vì nó đứng đầu).
#  2. Đưa đủ địa chỉ nhưng mở đầu bằng CÂU KHẲNG ĐỊNH ("Địa chỉ đầy đủ hiện
#     nay là: ...") rồi mới hỏi -> Gemini chỉ diễn giải lại câu khẳng định
#     ("Cảm ơn bạn đã cung cấp địa chỉ... khu vực này thuộc phường Tây Nha
#     Trang") mà không thực sự trả lời câu hỏi.
#  3. Câu hỏi trực tiếp + trả lời dòng "old_ward: <tên>" -> vẫn có POI trả lời
#     khác nhau giữa các lượt chạy lại (Đức Hưng Quán: "Lộc Thọ" rồi "Xương
#     Huân") vì không có TÊN QUÁN làm neo ngữ cảnh, chỉ có toạ độ/địa chỉ trần —
#     Gemini phải đoán khu vực từ địa chỉ thay vì tra cứu đúng quán.
# Giờ đưa CẢ tên quán lẫn địa chỉ hiện tại (cùng ngữ cảnh POI đã dùng ở
# profile_prompt/old cho search Maps), và ép output là MỘT object JSON duy nhất
# — dễ parse chắc chắn hơn dòng "old_ward: X" (không lẫn với tiêu đề nguồn trích
# dẫn Gemini hay chèn), lại rõ ràng hơn cho model là "chỉ điền một khoá, không
# viết văn xuôi".
old_address_prompt = """Quán "{poi}" hiện có địa chỉ: "{address}", thuộc thành phố {city}. Trước ngày 1/7/2025 (trước đợt sáp nhập đơn vị hành chính cấp xã/phường), địa chỉ này thuộc phường hoặc xã cũ nào?

CHỈ trả lời bằng ĐÚNG MỘT object JSON theo khuôn dưới đây, không kèm bất kỳ chữ nào khác trước hoặc sau, không giải thích, không bọc trong khối markdown:

{{"old_ward": "<tên phường hoặc xã cũ>"}}

Ví dụ mẫu trả lời đúng: {{"old_ward": "Vĩnh Hải"}}

TUYỆT ĐỐI KHÔNG liệt kê danh sách các phường/xã, KHÔNG giải thích, KHÔNG nhắc lại địa chỉ, KHÔNG mở đầu bằng lời chào hay lời cảm ơn, KHÔNG trả lời gì ngoài object JSON đó."""

# Coi như model trả lời xong khi text không đổi trong ngần này giây.
stable_seconds = 3.0
# [2026-08-17] Từng là 240s, tăng lên 360s: thread chat #2 dùng chung, tích luỹ
# càng nhiều lượt (ảnh + JSON) trong ngày càng lâu mới BẮT ĐẦU sinh phản hồi —
# đã kiểm chứng bằng cách theo dõi trực tiếp: mọi tin nhắn "timeout" trong một
# batch dài đều cuối cùng vẫn được trả lời, chỉ là chậm hơn ngưỡng cũ.
response_timeout = 360.0

[gmaps]
search_url = "https://www.google.com/maps/search/{query}?hl=vi"

# Tên quán trùng nhau giữa các tỉnh ("Bánh Canh Ghẹ ..." có ở cả Nha Trang lẫn
# Hà Nội). Không neo vùng thì Google trả về quán sai tỉnh và TOÀN BỘ dòng dữ
# liệu sai theo. Chuỗi này được ghép vào truy vấn nếu tên POI chưa chứa nó.
search_region = "Nha Trang"
# Tỉ lệ từ trong tên POI phải khớp với tên Google tìm được. Thấp hơn -> CHẶN
# bước maps (raise), không chỉ cảnh báo — lấy nhầm quán làm sai cả dòng dữ liệu
# mà không có dấu hiệu gì nếu chỉ warn (đã gặp: "Greek Cuisine" -> Google trả về
# "Greek Kitchen" ở địa chỉ khác, khớp đúng 0.5, lọt qua ngưỡng cũ trong im lặng).
name_match_threshold = 0.6
# Tỉ lệ từ trong phần ĐƯỜNG của địa chỉ mẫu (--address) khớp với địa chỉ Google
# tìm được. Chỉ áp dụng khi có --address; thấp hơn -> CHẶN bước maps.
address_match_threshold = 0.5
secondary_photo_count = 3
# Số ảnh lấy từ mục "Tất cả" của gallery để người gán nhãn tick chọn 3 ảnh cho
# raw_gallery_urls (tab "Ảnh" trong giao diện). Nhiều hơn 10 thì phải cuộn thêm
# vòng nữa mà lợi ích không đáng — 10 ảnh đầu đã là ảnh Google xếp trên cùng.
gallery_candidate_count = 10
# Gemini chỉ nhận tối đa 10 ảnh đính kèm mỗi lượt — gửi nhiều hơn thì phần dư bị
# lặng lẽ bỏ qua (đã kiểm chứng 2026-08-11: gửi 20, Gemini chỉ thấy menu_01..10).
max_menu_images = 10
positive_min_stars = 4
negative_max_stars = 2
reviews_per_bucket = 5
# Độ phân giải khi viết lại URL googleusercontent -> =w{size}-h{size}-p-k-no
image_size = 1080

[tiktok]
search_url = "https://www.tiktok.com/search?q={query}"
# Tab "Video" cho 23-24 kết quả trong khi tab "Top" chỉ 5-12, và mọi selector
# đang khai báo dùng được nguyên xi cho cả hai. Cuộn KHÔNG ra thêm kết quả (đã
# đo 2026-08-18: 24 -> 24 sau 4 lần cuộn) nên mở rộng bể ứng viên phải bằng cách
# hợp hai tab.
video_search_url = "https://www.tiktok.com/search/video?q={query}"
# Tab "Người dùng" — nguồn tài khoản chính chủ. Đây là cách duy nhất gỡ được POI
# tên không phải Latin: TikTok tự chuyển tự, "Кафе Лан" ra "@caflan.flan.gi.s /
# CAFLAN NHA TRANG", việc mà mọi cách so chuỗi cục bộ đều bó tay.
user_search_url = "https://www.tiktok.com/search/user?q={query}"
candidate_count = 5
user_candidate_count = 20
search_timeout_ms = 45000

# Trọng số 4 tín hiệu. `author` nặng gần bằng `caption` vì đo trên 121 POI: 55
# POI có tài khoản chính chủ trong danh sách, 25 trong số đó bị xếp dưới reviewer
# vãng lai do trước đây `author` hoàn toàn không được chấm điểm.
weight_caption = 0.40
weight_author = 0.35
weight_tag = 0.15
weight_address = 0.10

# Dưới ngưỡng này thì raw_url + video_posted_date để TRỐNG kèm cảnh báo, thay vì
# ghi bừa ứng viên tốt nhất. Hiệu chỉnh bằng scripts/rescore_tiktok.py, đừng đoán.
#
# Thang điểm để đọc con số này cho đúng (tổng trọng số = 1.0):
#   chỉ author khớp trọn      -> 0.35   (đã đủ tin: đúng tài khoản quán)
#   author khớp một phần      -> 0.175
#   caption trọn + hashtag    -> 0.55
# Chọn 0.20 để giữ lại nhóm "author khớp một phần" — bộ đo chạy trên data.json CŨ
# nên chưa có cú hích từ tab Users; ngoài thực tế các ca đó lên 0.35 (đã gặp:
# "chớm brew&bloom" đúng tài khoản chính chủ nhưng chỉ được 0.175 khi đo lại).
# Chạy lại `rescore_tiktok.py --threshold` sau đợt cào đầu tiên để chốt lại.
confidence_threshold = 0.20
# Điểm khớp tên tối thiểu để coi một tài khoản ở tab Users là chính chủ. Tab Users
# xếp theo độ liên quan CỦA TIKTOK: truy vấn "Кафе Лан" cho tài khoản 62K follower
# không liên quan ở #1, quán thật ở #2 -> vẫn phải tự đối chiếu tên.
official_account_threshold = 0.5

# Từ chỉ NGÀNH chứ không chỉ danh tính quán. Cần khai báo tay BÊN CẠNH idf: idf
# tính trên caption tiếng Việt nên coi từ ngành tiếng Anh là "hiếm" và cho điểm
# cao oan (đã gặp: "milk" -> "La Tra Milk Tea" khớp nhầm "@kachamilkteanhatrang").
industry_stopwords = [
  "ca", "phe", "cafe", "café", "coffee", "quan", "nha", "hang", "restaurant",
  "tra", "sua", "an", "vat", "banh", "com", "bar", "pub", "tiem", "shop",
  "food", "drink", "milk", "tea", "juice", "bakery", "kitchen", "bistro",
  "beer", "buffet", "grill", "eatery", "store", "house", "garden", "roastery",
]

# Facebook KHÔNG phải nguồn video chính — nó là nguồn XÁC MINH. Giá trị nằm ở chỗ
# search/pages trả về địa chỉ đường của quán, thứ tách được quán trùng tên mà
# TikTok bắt phải đoán mò (đo 2026-08-18: cùng truy vấn "mosa coffee Nha Trang"
# cho ra quán đúng ở Nha Trang + 2 shop thời trang ở Hà Nội và Sơn La).
[facebook]
search_pages_url = "https://www.facebook.com/search/pages?q={query}"
# Tab video của CHÍNH Trang. Phải lấy từ đây chứ không phải search/videos?q=:
# tìm theo từ khoá trả về video của bất kỳ ai nhắc tên quán, nên xác minh Trang
# xong cũng không bảo đảm gì cho video (đã gặp: Trang "mo:sa coffee" xác minh
# đúng nhưng tìm từ khoá ra Reel của "Góc Của Mây" và một quảng cáo hè).
page_videos_url = "https://www.facebook.com/profile.php?id={ref}&sk=videos"
candidate_count = 5
search_timeout_ms = 30000
# Tỉ lệ từ trong phần ĐƯỜNG của địa chỉ Google khớp địa chỉ Trang Facebook. Dùng
# chung quy tắc với gmaps.address_match để không có hai chuẩn so khớp khác nhau.
address_match_threshold = 0.5

[output]
dir = "output"

# Giá trị cố định điền vào các cột không lấy được từ 3 nguồn.
[dataset]
# Chỉ còn là giá trị lùi cho data.json cũ chưa có khoá `category_l1`. POI chạy
# mới lấy giá trị do bước `maps` phân loại (xem [category], schema.classify_l1).
category_l1 = "FOOD"
status = "active"
review_status = "draft"
booking_source = "internal"
rating_source = "Google Maps"
labeled_by = "Khải"
# Mọi dòng xuất ra đều mang mức này, không dùng mức Gemini tự chấm. Người gán
# nhãn rà lại rồi hạ xuống nếu cần.
confidence_level = "Cao"
info_expiry_note = "Giá và giờ mở cửa có thể thay đổi, cần kiểm tra lại định kỳ."

# Phường/xã sau sáp nhập 2025. Google Maps vẫn trả tên CŨ, dataset dùng tên MỚI.
# Không suy ra được từ dữ liệu Google -> phải khai báo tay, bổ sung dần.
# Khoá = tên phường Google trả về (viết thường, không dấu) HOẶC tên đường.
# Địa chỉ gốc của Google luôn được giữ nguyên ở cột old_address.
[ward_map]
"phuoc tien" = "Tây Nha Trang"
"ngo gia tu" = "Tây Nha Trang"
"xuong huan" = "Bắc Nha Trang"
"loc tho" = "Nam Nha Trang"

# Bảng riêng, KHÔNG để trong [dataset] — nếu không settings()['old_wards'] rỗng
# và toàn bộ khâu đối chiếu bị vô hiệu trong im lặng.
[nha_trang]
# Danh sách phường/xã CŨ của TP Nha Trang (trước 1/7/2025). Câu trả lời của
# Gemini phải nằm trong danh sách này mới được chấp nhận — lọc theo hình dạng
# chuỗi là không đủ, Gemini chèn cả tiêu đề nguồn trích dẫn ("Khu du lịch Bửu
# Long -", "Laodong.vn") thành dòng riêng trông y hệt một câu trả lời ngắn.
old_wards = [
  "Vĩnh Hải", "Vĩnh Phước", "Vĩnh Thọ", "Xương Huân", "Vạn Thắng", "Vạn Thạnh",
  "Phương Sài", "Phương Sơn", "Ngọc Hiệp", "Phước Hải", "Phước Tân",
  "Phước Tiến", "Phước Hòa", "Lộc Thọ", "Tân Lập", "Vĩnh Nguyên",
  "Vĩnh Trường", "Phước Long", "Vĩnh Hòa",
  "Vĩnh Phương", "Vĩnh Trung", "Vĩnh Thạnh", "Vĩnh Thái", "Vĩnh Hiệp",
  "Vĩnh Ngọc", "Vĩnh Lương", "Phước Đồng",
]


# Phân loại POI. Bảng RIÊNG ở cuối file, KHÔNG nhét vào [dataset] — bảng con
# lọt nhầm vào bảng khác từng khiến cả khâu đối chiếu vô hiệu trong im lặng
# (xem [nha_trang].old_wards). Kiểm chứng sau khi sửa:
#   .venv/bin/python -c "from vsf.config import settings; print(settings()['category'])"
[category]
l1_default = "FOOD"

# 5 nhãn hợp lệ DUY NHẤT của cột category_l2. Đây là nguồn sự thật cho cả
# prompt Gemini ({l2_values}) lẫn bộ kiểm tra ở schema.normalize_l2 — sửa ở đây
# là cả hai nơi cùng đổi, không còn ba bản danh sách trôi lệch nhau.
l2_values = ["Nhà hàng", "Quán ăn", "Quán cà phê", "Quán Bar", "Ăn vỉa hè"]
# Không suy ra được nhãn nào thì rơi về đây: đại đa số POI đang gán nhãn là
# quán ăn, đoán "Quán ăn" sai ít hơn hẳn để trống.
l2_fallback = "Quán ăn"

# Nhãn ngành Google chứa một trong các từ này -> KHÔNG phải FOOD, dừng pipeline.
# Cố ý là danh sách ĐEN chứ không phải danh sách TRẮNG: vốn từ nhãn ngành của
# Google là mở (nhà hàng chay / quán ăn nhanh / tiệm bánh / quán hải sản /
# quán ăn Việt Nam...), whitelist sẽ chặn nhầm quán thật trong im lặng. Một
# khách sạn lọt qua thì lộ ngay (không có menu, dữ liệu vô nghĩa); một quán
# thật bị chặn chỉ để lại dòng stub mà người gán nhãn khó nhận ra.
non_food_markers = [
  "khách sạn", "nhà nghỉ", "resort", "homestay", "villa", "hostel",
  "spa", "salon", "phòng khám", "bệnh viện", "nha khoa",
  "bãi biển", "công viên", "chùa", "nhà thờ", "bảo tàng", "khu du lịch",
  "siêu thị", "trung tâm thương mại", "ngân hàng", "cây xăng",
  "trường học", "đại học", "sân bay", "bến xe", "nhà ga",
]

# Từ khoá trong nhãn ngành Google / tên quán -> category_l2. Xét THEO THỨ TỰ,
# khớp trước thắng, nên thứ tự dưới đây có ý nghĩa: "Quán cà phê" đứng trước
# "Nhà hàng" vì "Nhà hàng - Cà phê ABC" nên về nhóm cà phê.
#
# LƯU Ý ánh xạ không phải rename cơ học từ bộ giá trị snake_case cũ:
#  - quan_nhau cũ TÁCH ĐÔI: beer club/bia hơi/pub -> "Quán Bar", còn quán nhậu
#    bình dân rơi về "Quán ăn" (fallback).
#  - quan_an_vat cũ KHÔNG thành "Ăn vỉa hè": tiệm bánh/kem/chè có mặt bằng là
#    "Quán ăn". "Ăn vỉa hè" chỉ dành cho hàng rong/xe đẩy thật.
[[category.l2_hints]]
keywords = ["cà phê", "ca phe", "cafe", "café", "coffee", "trà sữa", "tra sua", "tiệm trà"]
value = "Quán cà phê"

[[category.l2_hints]]
keywords = ["bar", "pub", "bia hơi", "bia tươi", "beer", "cocktail", "lounge", "bistro"]
value = "Quán Bar"

[[category.l2_hints]]
keywords = ["nhà hàng", "nha hang", "restaurant", "buffet"]
value = "Nhà hàng"

[[category.l2_hints]]
keywords = ["vỉa hè", "via he", "street food", "xe đẩy", "hàng rong", "quán cóc", "gánh"]
value = "Ăn vỉa hè"
