Quy ước:
- name_en: CHỈ ghi khi cơ sở thật sự có tên tiếng Anh chính thức. Không có thì ghi "không có" — tuyệt đối đừng bỏ dấu tên tiếng Việt rồi coi đó là tên tiếng Anh
- category_l2: chọn ĐÚNG MỘT trong các nhãn sau, chép NGUYÊN VĂN kể cả dấu và chữ hoa/thường, không dịch, không viết tắt, không tự nghĩ nhãn mới: {l2_values}
- tags: chọn NHIỀU nhãn phù hợp (thường 4-8), chép NGUYÊN VĂN kể cả dấu, chữ hoa/thường và dấu gạch chéo bên trong nhãn, ngăn các nhãn bằng dấu chấm phẩy ";". CHỈ được dùng nhãn trong danh sách sau, không tự nghĩ nhãn mới, không mô tả bằng câu văn: {tags_values}
- star_rating: chỉ ghi dạng "3 sao", "4 sao", "5 sao". Cơ sở không xếp hạng sao (homestay, nhà nghỉ, villa) thì để trống
- room_types: các hạng phòng, ngăn bởi dấu phẩy (ví dụ: Superior, Deluxe, Suite)
- total_rooms: chỉ ghi con số tổng số phòng
- check_in_time, check_out_time: chỉ ghi giờ dạng 24h "14:00", "11:30"
- key_amenities: 8-12 tiện nghi nổi bật, ngăn bởi dấu phẩy
- breakfast_included, pet_friendly, booking_required: chỉ ghi có hoặc không
- view_type: chọn NHIỀU nhãn phù hợp (thường 1-3), chép NGUYÊN VĂN kể cả dấu, chữ hoa/thường và dấu gạch chéo bên trong nhãn, ngăn các nhãn bằng dấu chấm phẩy ";". CHỈ được dùng nhãn trong danh sách sau, không tự nghĩ nhãn mới, không mô tả bằng câu văn: {view_type_values}. Cơ sở không có view đáng kể thì để trống
- brand_chain: tên chuỗi/thương hiệu quản lý. Cơ sở độc lập thì để trống
- description_short: ĐÚNG 2 CÂU, mỗi câu kết thúc bằng dấu chấm
- description_long: ĐÚNG 5 CÂU, mỗi câu kết thúc bằng dấu chấm
- suitable_for: chọn NHIỀU nhãn phù hợp (thường 3-6), chép NGUYÊN VĂN kể cả dấu, chữ hoa/thường và dấu gạch chéo bên trong nhãn, ngăn các nhãn bằng dấu chấm phẩy ";". CHỈ được dùng nhãn trong danh sách sau, không tự nghĩ nhãn mới, không mô tả bằng câu văn: {suitable_for_values}
- not_suitable_for: chọn NHIỀU nhãn phù hợp (thường 2-4), chép NGUYÊN VĂN kể cả dấu, chữ hoa/thường và dấu gạch chéo bên trong nhãn, ngăn các nhãn bằng dấu chấm phẩy ";". CHỈ được dùng nhãn trong danh sách sau, không tự nghĩ nhãn mới, không mô tả bằng câu văn: {not_suitable_for_values}
- matched_intents: chọn NHIỀU nhãn phù hợp (thường 3-6), chép NGUYÊN VĂN kể cả dấu phẩy bên trong nhãn, ngăn các nhãn bằng dấu chấm phẩy ";". CHỈ được dùng nhãn trong danh sách sau, không tự nghĩ nhãn mới, không ghi câu tìm kiếm: {matched_intents_values}
- estimated_duration: tính theo ĐÊM, ví dụ "2-5 đêm"
- confidence_level: cao, trung bình hoặc thấp
- info_expiry_note: ghi chú thông tin cần kiểm tra lại sau bao lâu"""

# Bảng giá phòng — vai trò y hệt menu_prompt của profile FOOD, nhưng khách sạn
# KHÔNG có tab "Thực đơn" trên Google Maps để chụp ảnh dán vào. Nguồn duy nhất
# là Gemini tự tra web, nên prompt phải nêu rõ nguồn cần tra thay vì trông chờ
# vào ảnh đính kèm.
#
# "gia" quy ước theo NGHÌN ĐỒNG để khớp với schema.menu_prices() — hàm đó luôn
# nhân 1000, nên nếu Gemini trả giá đầy đủ VNĐ thì price_min/price_max sẽ sai
# gấp 1000 lần. Đây đúng là cái bẫy đã ghi ở menu_prompt, giữ nguyên cách chống.
room_price_prompt = """Tra bảng giá phòng của cơ sở lưu trú "{poi}"{address_clause} tại Nha Trang, Khánh Hòa. Tham khảo trang chính thức của cơ sở và các trang đặt phòng phổ biến (Booking.com, Agoda, Traveloka). Lấy giá công bố cho MỘT ĐÊM, hạng khách 2 người tiêu chuẩn, ngoài mùa cao điểm.

Trả về ĐÚNG một mảng JSON theo khuôn:
[
  {{"loai_phong":"hạng phòng","ten":"tên đầy đủ của phòng","gia":"số"}}
]

Quy tắc:
- dùng đúng ba khoá trên, mỗi phòng một dòng, xếp từ rẻ đến đắt
- "loai_phong" là hạng phòng gọn (Superior, Deluxe, Executive, Family, Suite...); "ten" là tên đầy đủ như trang đặt phòng hiển thị
- "gia" là chuỗi SỐ NGUYÊN theo đơn vị NGHÌN ĐỒNG: phòng 1.030.000đ ghi "1030", phòng 890.000đ ghi "890". KHÔNG nhân thêm số 0, KHÔNG dùng dấu phẩy hay dấu chấm ngăn nghìn, KHÔNG kèm "đ"/"VND"/"k"
- giá là một khoảng thì lấy cận dưới
- không tra được giá của một phòng thì để "gia" là chuỗi rỗng, vẫn giữ dòng đó
- giữ nguyên dấu tiếng Việt
- chỉ trả về mảng JSON, không markdown, không giải thích, không trích dẫn nguồn"""

# Gửi khi câu trả lời giá phòng trôi khỏi định dạng JSON. Không nêu lại bảng giá
# — Gemini vẫn nhìn thấy câu trả lời văn xuôi ngay phía trên, chỉ cần ép khuôn.
room_price_reformat_prompt = """Hãy trình bày lại bảng giá phòng vừa tra ở trên dưới dạng một mảng JSON, mỗi phòng là một object với đúng ba khoá "loai_phong", "ten" và "gia". "gia" chỉ ghi số nguyên theo đơn vị nghìn đồng, KHÔNG dùng dấu phẩy ngăn nghìn (ví dụ 1.030.000 đồng ghi là "1030", không ghi "1,030,000"). Chỉ trả về mảng JSON, không kèm giải thích, không bọc trong khối markdown."""

