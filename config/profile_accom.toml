# Profile ACCOM — POI lưu trú (khách sạn / resort / villa / homestay / nhà nghỉ),
# 72 cột.
#
# File này chứa MỌI thứ phụ thuộc vào dataset: giá trị cố định của cột, bộ phân
# loại ngành, và prompt Gemini. Phần dùng chung cho mọi profile (browser, gmaps,
# tiktok, facebook, ward_map, URL + timeout của Gemini) nằm ở
# config/settings.toml. Khoá trùng tên thì file này THẮNG.
#
# Tách file thay vì lồng [profiles.accom.*] vào settings.toml là cố ý: mỗi file
# giữ được bảng PHẲNG. Bảng con lọt nhầm vào bảng khác từng khiến
# settings()["old_wards"] rỗng và vô hiệu cả khâu đối chiếu trong im lặng.

# Giá trị cố định điền vào các cột không lấy được từ 3 nguồn.
[dataset]
# Giá trị lùi cho data.json chưa có khoá `category_l1`. POI chạy mới lấy giá trị
# do bước `maps` phân loại (xem [category], schema.classify_l1).
category_l1 = "ACCOM"
status = "active"
review_status = "draft"
booking_source = "internal"
rating_source = "Google Maps"
labeled_by = "Khải"
# Mọi dòng xuất ra đều mang mức này, không dùng mức Gemini tự chấm. Người gán
# nhãn rà lại rồi hạ xuống nếu cần.
confidence_level = "Cao"
info_expiry_note = "Giá phòng và chính sách nhận/trả phòng có thể thay đổi theo mùa, cần kiểm tra lại định kỳ."

[gemini]
# HAI THREAD RIÊNG của profile lưu trú, tách khỏi hai thread của profile đồ ăn.
# Ghi đè khoá cùng tên ở settings.toml (gộp nông theo section, file profile
# thắng). Mỗi thread có slot tab riêng — xem browser.gemini_slots().
#
# Vì sao tách: hai thread của food đã tích luỹ hàng trăm lượt trả biểu mẫu 26
# trường ĐỒ ĂN. Hỏi khách sạn trên đúng thread đó thì lịch sử ngay phía trên là
# một lực kéo ngược — Gemini bám mẫu cũ và trả về cuisine_type/must_try_dishes
# cho một cái khách sạn.
#
# [2026-08-20] Tạo mới bằng cách gửi THẲNG prompt thật (không phải câu chào), và
# đo lại ngay: thread #1 trả 27/28 trường ở lượt đầu tiên, thread #2 trả đúng
# mảng JSON giá phòng. Tức là cảnh báo "thread rỗng làm hỏng định dạng" ghi ở
# settings.toml KHÔNG tái diễn ở đây — nhiều khả năng vì lượt đầu đã là một
# biểu mẫu đầy đủ nên thread không bao giờ thực sự rỗng, và vì bộ trường lưu trú
# ít trùng với mẫu grounding "danh thiếp địa điểm" của Gemini hơn bộ đồ ăn.
# Nếu về sau thấy tụt trường hàng loạt, đây là chỗ đầu tiên cần nghi.
profile_chat_url = "https://gemini.google.com/app/b2c140bfc3ad5f2c?hl=vi"
menu_chat_url = "https://gemini.google.com/app/d70840fefa84f780?hl=vi"

# One-shot: hỏi ĐỦ 28 trường + quy ước trong MỘT lượt. Giữ nguyên THỦ THUẬT
# BIỂU MẪU của profile FOOD ("chép lại nguyên văn từng dòng rồi điền vào sau dấu
# hai chấm") — bản chỉ đưa DANH SÁCH tên trường đã từng khiến Gemini tự dịch
# `suitable_for` thành `doi_tuong_phu_hop` và làm hỏng cả khâu parse.
# {poi} = tên POI; {address_clause} = " (địa chỉ: ...)" nếu có địa chỉ mẫu, rỗng
# nếu không — cùng lý do gmaps.search_query() ghép địa chỉ vào truy vấn Maps:
# giúp Gemini không lấy nhầm cơ sở trùng tên ở tỉnh/phố khác. Chuỗi khách sạn
# đặt tên lặp giữa các thành phố ("Mường Thanh", "Ibis") nên chốt này còn quan
# trọng hơn ở đồ ăn.
profile_prompt = """Cơ sở lưu trú cần tra: "{poi}"{address_clause} tại Nha Trang, Khánh Hòa (có thể có cơ sở trùng tên ở tỉnh/thành khác, nhất là với các chuỗi khách sạn — chỉ lấy đúng cơ sở này).

Đây là một BIỂU MẪU (template) {n_fields} dòng. Nhiệm vụ của bạn CHỈ là chép lại NGUYÊN VĂN {n_fields} dòng dưới đây rồi điền giá trị vào ngay sau dấu hai chấm của MỖI dòng. TUYỆT ĐỐI KHÔNG được đổi, dịch, viết lại, thêm hay bớt bất kỳ tên trường nào (phần TRƯỚC dấu hai chấm) — giữ nguyên y hệt ký tự cho ký tự, kể cả khi có vẻ nó "nên" được dịch sang tiếng Việt. Không viết thêm dòng nào khác ngoài {n_fields} dòng này (không mở đầu, không dẫn nhập, không trích dẫn nguồn, không markdown, không đánh số). Nếu không tra được thì suy luận hợp lý từ thông tin đã biết, đừng bỏ trống — CHỈ được để trống nếu quy ước bên dưới cho phép:

name_en:
category_l2:
