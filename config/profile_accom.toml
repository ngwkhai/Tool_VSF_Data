[category]
l1_default = "ACCOM"

# NGƯỢC HẲN với profile FOOD: đây là danh sách TRẮNG. Nhãn ngành Google KHÔNG
# chứa từ nào dưới đây -> không phải cơ sở lưu trú, dừng pipeline.
#
# FOOD phải dùng blacklist vì vốn từ nhãn ngành đồ ăn của Google là MỞ (nhà hàng
# chay / quán ăn nhanh / tiệm bánh / quán hải sản / quán ăn Việt Nam...) — không
# liệt kê hết được, whitelist sẽ chặn nhầm quán thật trong im lặng. Vốn từ lưu
# trú thì ngược lại: ĐÓNG và nhỏ, Google chỉ dùng đúng mấy nhãn dưới đây. Ở đây
# blacklist mới là cái bất khả thi (phải liệt kê MỌI ngành không phải lưu trú),
# nên chiều của cổng chặn đảo lại.
mode = "whitelist"
markers = [
  "khách sạn", "nhà nghỉ", "resort", "khu nghỉ dưỡng",
  "homestay", "hostel", "motel", "guest house", "guesthouse",
  "villa", "biệt thự", "căn hộ dịch vụ", "nhà khách", "lưu trú",
]

# Ngưỡng cột price_level, theo VNĐ, tính cho MỘT ĐÊM: dưới mức đầu là "budget",
# dưới mức sau là "mid-range", trên nữa là "luxury". KHÔNG dùng chung ngưỡng
# 150k/500k của profile FOOD — đó là thang giá một bữa ăn, đem áp cho một đêm
# phòng thì mọi khách sạn đều thành "luxury".
price_levels = [700000, 2000000]

# 5 nhãn hợp lệ DUY NHẤT của cột category_l2. Đây là nguồn sự thật cho cả prompt
# Gemini ({l2_values}) lẫn bộ kiểm tra ở schema.normalize_l2 — sửa ở đây là cả
# hai nơi cùng đổi, không còn hai bản danh sách trôi lệch nhau.
l2_values = ["Resort", "Khách sạn", "Villa", "Homestay", "Nhà nghỉ"]
# Không suy ra được nhãn nào thì rơi về đây: đại đa số POI lưu trú đang gán nhãn
# là khách sạn, đoán "Khách sạn" sai ít hơn hẳn để trống.
l2_fallback = "Khách sạn"

# Bộ giá trị hợp lệ DUY NHẤT của cột matched_intents. Khác `l2_values` ở chỗ đây
# là NHIỀU lựa chọn — một khách sạn thường khớp 3-6 ý định.
#
# Nguồn sự thật cho cả prompt Gemini ({matched_intents_values}) lẫn bộ lọc ở
# schema.normalize_intents. Không có bộ lọc thì Gemini trả về câu tìm kiếm thay
# vì nhãn (đã gặp: "Đặt khách sạn giá rẻ Nha Trang, tìm khách sạn phố Tây..." —
# đó là search_keywords, không phải ý định).
#
# LƯU Ý hai nhãn có DẤU PHẨY bên trong ("Nghỉ dưỡng, thư giãn" và "Ghé nhanh,
# tiện đường"). Vì thế cột này KHÔNG được xử lý bằng `as_list` như các cột danh
# sách khác — tách theo dấu phẩy là vỡ chúng thành bốn mảnh vô nghĩa. Xem
# schema.normalize_intents.
matched_intents_values = [
  "Lưu trú lâu ngày",
  "Hẹn hò lãng mạn",
  "Trăng mật",
  "Gia đình có trẻ nhỏ",
  "Gia đình đi cuối tuần",
  "Nhóm bạn",
  "Công tác",
  "Nghỉ dưỡng, thư giãn",
  "Check-in",
  "Tiết kiệm chi phí",
  "Trải nghiệm cao cấp",
  "Trải nghiệm như người bản địa",
  "Săn phòng có view đẹp",
  "Ghé nhanh, tiện đường",
  "Đi một mình",
  "Nghỉ dưỡng tại chỗ không di chuyển xa",
  "Nghỉ qua đêm gần sân bay/bến xe",
  "Đi cùng thú cưng",
]

# --- Bộ giá trị đóng của 4 cột nhãn còn lại -------------------------------
#
# Cùng vai trò với `matched_intents_values` ở trên và dựng theo đúng khuôn đó:
# mỗi khoá kết thúc bằng `_values` tự động trở thành một ô cùng tên trong prompt
# Gemini (xem pipeline._vocab_clauses) và là whitelist cho schema.normalize_vocab
# ở tầng xuất. Thêm một cột có bộ giá trị đóng thì chỉ cần khai thêm ở ĐÂY.
#
# Danh sách do người gán nhãn chốt (bảng ACCOM). Chép NGUYÊN VĂN, kể cả cách đặt
# dấu cách quanh dấu "/" — đó là cách viết sẽ ra tới file TSV. Riêng khâu so khớp
# thì miễn nhiễm với dấu cách và dấu "/" (normalize_vocab bỏ dấu rồi gộp mọi ký
# tự không phải chữ/số thành một khoảng trắng), nên Gemini viết "spa/trị liệu"
# vẫn khớp "spa / trị liệu".

# `tags` — nhãn mô tả tổng hợp, một cơ sở thường khớp 4-8 nhãn.
tags_values = [
  "khách sạn",
  "khu nghỉ dưỡng",
  "villa",
  "cao cấp / 5 sao/ sang trọng",
  "4 sao",
  "bình dân / 3 sao",
  "sát biển",
  "view biển",
  "trung tâm thành phố",
  "view núi/thành phố",
  "hồ bơi vô cực",
  "hồ bơi ngoài trời",
  "spa / trị liệu",
  "nhà hàng / buffet",
  "bbq",
  "gym",
  "gia đình",
  "cặp đôi",
  "nhóm bạn",
  "công tác/ hội nghị",
  "biệt thự",
  "hiện đại",
]

# `suitable_for` — nhóm khách nên ở đây. LƯU Ý ba nhãn lồng nhau ("gia đình",
# "gia đình có trẻ em", "đại gia đình"): normalize_vocab xét nhãn DÀI trước rồi
# xoá phần đã khớp, nên "gia đình có trẻ em" không bị "gia đình" ăn mất.
suitable_for_values = [
  "cặp đôi",
  "gia đình",
  "nhóm bạn",
  "khách đi một mình / tự túc",
  "khách ở dài ngày",
  "khách quốc tế",
  "làm việc từ xa",
  "nghỉ dưỡng",
  "kỷ niệm",
  "gia đình có trẻ em",
  "đại gia đình",
  "teambuilding",
  "sự kiện",
  "hội nghị / hội thảo",
  "người cao tuổi",
  "người trẻ",
]

# `not_suitable_for` — nhóm khách KHÔNG nên ở đây.
not_suitable_for_values = [
  "khách mang theo thú cưng",
  "du lịch bụi / ngân sách thấp",
  "khách tìm phòng siêu rẻ",
  "cặp đôi tối ưu chi phí",
  "khách tìm nơi yên tĩnh",
  "khách muốn ở trung tâm",
  "người di chuyển không thuận tiện",
  "nhóm thích tiệc tùng ồn ào",
  "khách muốn tự nấu nướng",
  "khách đòi hỏi resort có bãi biển riêng khép kín",
]

# `view_type` — hướng nhìn từ phòng. "attraction_view" giữ NGUYÊN dạng snake_case
# của bảng gốc, không Việt hoá: dataset đang dùng đúng chuỗi đó.
view_type_values = [
  "biển",
  "núi",
  "thành phố",
  "hồ bơi",
  "sân vườn",
  "attraction_view",
]

# Từ khoá trong nhãn ngành Google / tên cơ sở -> category_l2. Xét THEO THỨ TỰ,
# khớp trước thắng, nên thứ tự dưới đây có ý nghĩa:
#  - "Resort" đứng TRƯỚC "Khách sạn" vì "Khách sạn & Resort ABC" nên về nhóm
#    resort — nhãn cụ thể hơn thắng nhãn tổng quát.
#  - "Villa" đứng trước "Homestay" vì nhiều villa cho thuê tự mô tả là homestay,
#    nhưng hình thái (nguyên căn, có sân vườn) mới là thứ dataset cần phân biệt.
#  - "Nhà nghỉ" xuống cuối: nó là fallback của phân khúc thấp, còn "hostel" thì
#    đã có nhãn riêng ở trên nên không rơi nhầm xuống đây.
[[category.l2_hints]]
keywords = ["resort", "khu nghỉ dưỡng", "khu du lịch nghỉ dưỡng"]
value = "Resort"

[[category.l2_hints]]
keywords = ["villa", "biệt thự"]
value = "Villa"

[[category.l2_hints]]
keywords = ["homestay", "hostel", "guest house", "guesthouse", "căn hộ dịch vụ", "apartment"]
value = "Homestay"

[[category.l2_hints]]
keywords = ["khách sạn", "hotel", "motel"]
value = "Khách sạn"

[[category.l2_hints]]
keywords = ["nhà nghỉ", "nhà khách"]
value = "Nhà nghỉ"
